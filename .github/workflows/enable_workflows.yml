name: enable_workflows

# Workaround to prevent GitHub disabling scheduled workflows
# after 60 days of public repository inactivity.
# Reference: https://github.com/orgs/community/discussions/86087

on:
  schedule:
    - cron: '0 1 1,15 * *' # 1st and 15th of every month at 01:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable_workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Re-enable workflows disabled by inactivity
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # Workflow states:
          #   active              - enable anyway: resets the 60-day inactivity timer
          #   disabled_inactivity - re-enable: resets the 60-day inactivity timer
          #   disabled_manually   - skip: disabled on purpose
          #   disabled_fork       - skip: forks keep workflows off until the owner opts in
          #   deleted             - skip: not returned by the list API anyway
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | [.id, .state, .path] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_state workflow_path; do
            echo "Found ${workflow_path} state: ${workflow_state}"
            if [ "${workflow_state}" = "active" ] || [ "${workflow_state}" = "disabled_inactivity" ]; then
              gh api --method PUT \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable"
              echo "Enabled: ${workflow_path}"
            fi
          done
